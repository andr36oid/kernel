name: Build dArkOSen 5.10 kernel

on:
  push:
    branches:
      - darkosen-5.10
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  KBUILD_BUILD_USER: djpar
  KBUILD_BUILD_HOST: dArkOSen
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev ccache kmod cpio rsync

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-5.10-${{ github.sha }}
          restore-keys: ccache-5.10-

      - name: Set paths
        run: |
          echo "OUT=$GITHUB_WORKSPACE/out" >> $GITHUB_ENV
          echo "STAGE=$GITHUB_WORKSPACE/stage" >> $GITHUB_ENV
          echo "EXT=$GITHUB_WORKSPACE/ext" >> $GITHUB_ENV
          echo "KCC=ccache aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Configure
        working-directory: kernel
        run: make O=$OUT rockchip_linux_defconfig rk3326_linux.config darkosen.config

      - name: Build Image and modules
        working-directory: kernel
        run: |
          make O=$OUT CC="$KCC" -j$(nproc) Image modules
          echo "KREL=$(cat $OUT/include/config/kernel.release)" >> $GITHUB_ENV

      - name: Build out-of-tree Wi-Fi drivers
        run: |
          set -e
          mkdir -p $EXT
          while read -r name repo sha extra; do
            git init -q $EXT/$name
            git -C $EXT/$name fetch -q --depth 1 https://github.com/$repo.git $sha
            git -C $EXT/$name checkout -q FETCH_HEAD
            case $name in
              8723bu)
                sed -i 's/^EXTRA_CFLAGS += -DCONFIG_CONCURRENT_MODE/#&/' $EXT/$name/Makefile
                sed -i '/^#if 0$/{N;/building for Android/s/^#if 0/#if 1/}' $EXT/$name/os_dep/usb_intf.c
                ;;
              8192eu|8733bu)
                sed -i '/^MODULE_LICENSE("GPL");$/a MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);' $EXT/$name/os_dep/linux/os_intfs.c
                ;;
            esac
            make -C $EXT/$name CC="$KCC" KSRC=$OUT KVER=$KREL $extra -j$(nproc) modules
          done <<'LIST'
          8812au   morrownr/8812au-20210820           4722250273e4316daf9d8688e9916ea94c36a5ff
          8821cu   morrownr/8821cu-20210916           bda65aac150d2cde0df9603206eec23a6f3b77c4
          88x2bu   morrownr/88x2bu-20210702           d31ffa827bb95b8a436c2a469b5163b634ac4333
          8188fu   kelebek333/rtl8188fu               799fa0beacadce84bef6514d5948b454a8037c96
          8723bu   lwfinger/rtl8723bu                 af3a408d6399655b0db23c2c8720436ca725ca47
          8192eu   Mange/rtl8192eu-linux-driver       c629cc972a0d878c930d19c4a9309c27c1e61f92   CONFIG_PLATFORM_I386_PC=n CONFIG_PLATFORM_ARM_AARCH64=y CROSS_COMPILE=aarch64-linux-gnu-
          8733bu   ROCKNIX/RTL8733BU                  308919f005f439de433aac977f925bb57f59acf4
          LIST

      - name: Install modules
        run: |
          set -e
          make -C kernel O=$OUT INSTALL_MOD_PATH=$STAGE INSTALL_MOD_STRIP=1 modules_install
          mkdir -p $STAGE/lib/modules/$KREL/extra
          for ko in $EXT/*/*.ko; do
            aarch64-linux-gnu-strip --strip-debug -o $STAGE/lib/modules/$KREL/extra/$(basename $ko) $ko
          done
          rm -f $STAGE/lib/modules/$KREL/build $STAGE/lib/modules/$KREL/source
          depmod -b $STAGE $KREL
          tar -C $STAGE -czf $GITHUB_WORKSPACE/modules-$KREL.tar.gz lib

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp $OUT/arch/arm64/boot/Image dist/
          cp $OUT/.config dist/config-$KREL
          cp $OUT/System.map dist/System.map-$KREL
          mv modules-$KREL.tar.gz dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darkosen-kernel-${{ env.KREL }}
          path: dist/
